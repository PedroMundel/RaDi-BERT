# Instalar uma vez por clone: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
# Saídas geradas (resultados/, dados/) e histórico encerrado (screening, entrega) ficam fora dos fixers de
# texto: mudar um byte ali quebra a reprodução das saídas.
exclude: ^(resultados|dados|entrega|docs/screening|scripts/screening)/
# Sem isto, os ganchos de arquivo rodam de novo na etapa commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  # Só lint: ruff-format reescreveria o código antigo inteiro; formatação entra quando o código for tocado.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, docs, chore, style, build, perf, ci, revert, exp]

  - repo: local
    hooks:
      - id: sem-trailer-claude
        name: sem trailer de autoria do Claude
        entry: python scripts/hooks/sem_trailer_claude.py
        language: python
        stages: [commit-msg]
